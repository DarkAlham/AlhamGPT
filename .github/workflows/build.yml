name: Build AlhamGPT APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          # Works whether you uploaded the whole project or just AlhamGPT.zip
          if [ -f AlhamGPT.zip ]; then
            unzip -q -o AlhamGPT.zip
            cd AlhamGPT
          fi
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/AlhamGPT.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AlhamGPT-apk
          path: out/AlhamGPT.apk
